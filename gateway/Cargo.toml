# genflow-gateway — API Gateway binary (Axum)
# Hybrid: single binary, routes to all Islands as lib crates
# Composition root: AppState holds all island service references

[package]
name = "genflow-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "genflow-api"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
sqlx = { workspace = true }
redis = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
jsonwebtoken = { workspace = true }
prometheus = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }

# All internal crates
genflow-receptors = { workspace = true }
genflow-shared-infra = { workspace = true }
genflow-synaptic-hub = { workspace = true }
genflow-mcp-registry = { workspace = true }
genflow-position-generation = { workspace = true }
genflow-candidate-matching = { workspace = true }
genflow-dashboard-analytics = { workspace = true }
