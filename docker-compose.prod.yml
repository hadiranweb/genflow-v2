# =============================================================================
# GenFlow v2 — Production Override
#
# Apply on top of docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Adds: Nginx reverse proxy + SSL, autoheal, secrets, resource guarantees
# =============================================================================

version: "3.9"

services:

  # ----------------------------------------------------------
  # Nginx — Reverse Proxy (SSL termination, routing, caching)
  # ----------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: genflow-nginx
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/ssl:/etc/nginx/ssl:ro
      - web-static:/var/www/static:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 60s
      timeout: 5s
      retries: 3
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - genflow
    deploy:
      resources:
        limits:
          cpus: "${NGINX_CPU_LIMIT:-0.5}"
          memory: "${NGINX_MEM_LIMIT:-256M}"
        reservations:
          cpus: "${NGINX_CPU_RES:-0.1}"
          memory: "${NGINX_MEM_RES:-64M}"

  # ----------------------------------------------------------
  # Autoheal — Restart unhealthy containers automatically
  # ----------------------------------------------------------
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: genflow-autoheal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal=true
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=60
    restart: always
    networks:
      - genflow

  # ----------------------------------------------------------
  # Production overrides for existing services
  # ----------------------------------------------------------
  api:
    restart: always
    labels:
      - "autoheal=true"
    env_file:
      - ./deploy/.env.production
    secrets:
      - jwt_secret
      - db_password
    healthcheck:
      start_period: 30s
      retries: 5

  web:
    restart: always
    labels:
      - "autoheal=true"

  db:
    restart: always
    labels:
      - "autoheal=true"
    volumes:
      - ./deploy/backups:/backups:rw
    environment:
      - POSTGRES_PASSWORD_FILE=/run/secrets/db_password
    secrets:
      - db_password

  redis:
    restart: always
    labels:
      - "autoheal=true"

# ============================================================
# Secrets
# ============================================================
secrets:
  jwt_secret:
    file: ./deploy/secrets/jwt_secret.txt
  db_password:
    file: ./deploy/secrets/db_password.txt

# ============================================================
# Shared volume for static assets
# ============================================================
volumes:
  web-static:
    name: genflow-web-static
