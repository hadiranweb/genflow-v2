name: CD

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      image_tag:
        description: 'GHCR image tag to deploy (default: latest)'
        required: false
        default: 'latest'
        type: string

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 📝 Prepare deployment variables
        id: vars
        run: |
          echo "deploy_dir=/opt/genflow" >> $GITHUB_OUTPUT
          echo "compose_file=docker-compose.yml" >> $GITHUB_OUTPUT
          echo "env_file=.env.production" >> $GITHUB_OUTPUT

      - name: 🔑 Deploy via SSH (staging)
        if: ${{ inputs.environment == 'staging' }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_PORT || 22 }}
          script: |
            set -e
            echo "🚀 GenFlow CD — target: staging"
            echo "   Image tag: ${{ inputs.image_tag }}"
            echo "   Timestamp: $(date -u)"
            cd ${{ steps.vars.outputs.deploy_dir }}
            if [ ! -f "${{ steps.vars.outputs.compose_file }}" ]; then
              echo "❌ docker-compose.yml not found"
              exit 1
            fi
            export IMAGE_TAG=${{ inputs.image_tag }}
            echo "📦 Pulling images..."
            docker compose pull
            echo "🔄 Recreating services..."
            docker compose up -d --remove-orphans
            echo "🏥 Running health check..."
            sleep 10
            HEALTH_URL="http://localhost:3000/health"
            for i in $(seq 1 10); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" 2>/dev/null || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "✅ Health check passed (attempt $i/10)"
                break
              fi
              if [ "$i" = "10" ]; then
                echo "❌ Health check failed after 10 attempts"
                docker compose logs --tail=20 api web
                exit 1
              fi
              echo "⏳ Waiting... (attempt $i/10, status=$STATUS)"
              sleep 5
            done
            echo "🧹 Cleaning up..."
            docker image prune -f --filter "until=24h"
            echo "✅ Deployment complete!"

      - name: 🔑 Deploy via SSH (production)
        if: ${{ inputs.environment == 'production' }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_PORT || 22 }}
          script: |
            set -e
            echo "🚀 GenFlow CD — target: production"
            echo "   Image tag: ${{ inputs.image_tag }}"
            echo "   Timestamp: $(date -u)"
            cd ${{ steps.vars.outputs.deploy_dir }}
            if [ ! -f "${{ steps.vars.outputs.compose_file }}" ]; then
              echo "❌ docker-compose.yml not found"
              exit 1
            fi
            export IMAGE_TAG=${{ inputs.image_tag }}
            echo "📦 Pulling images..."
            docker compose pull
            echo "🔄 Recreating services..."
            docker compose up -d --remove-orphans
            echo "🏥 Running health check..."
            sleep 10
            HEALTH_URL="http://localhost:3000/health"
            for i in $(seq 1 10); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" 2>/dev/null || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "✅ Health check passed (attempt $i/10)"
                break
              fi
              if [ "$i" = "10" ]; then
                echo "❌ Health check failed after 10 attempts"
                docker compose logs --tail=20 api web
                exit 1
              fi
              echo "⏳ Waiting... (attempt $i/10, status=$STATUS)"
              sleep 5
            done
            echo "🧹 Cleaning up..."
            docker image prune -f --filter "until=24h"
            echo "✅ Deployment complete!"

      - name: 📋 Deployment summary
        run: |
          echo "## ✅ Deployed ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Variable | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | ${{ inputs.environment }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Image tag | ${{ inputs.image_tag }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Timestamp | $(date -u) |" >> $GITHUB_STEP_SUMMARY
