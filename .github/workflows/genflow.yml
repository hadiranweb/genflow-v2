name: CI

on:
  push:
    branches: [main-platform, v2-island-architecture]
  pull_request:
    branches: [main-platform]

permissions: write-all

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "checkout OK"
      - run: rustup toolchain install 1.88 --component clippy,rustfmt --no-self-update 2>&1
      - run: rustup default 1.88
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --lib --locked --exclude genflow-gateway
      - run: cargo check -p genflow-gateway --locked

  docker-api:
    name: Docker API
    needs: [rust]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - uses: actions/checkout@v4
      - run: echo "docker api OK ${{ github.actor }}"

  docker-web:
    name: Docker Web
    needs: [rust]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - uses: actions/checkout@v4
      - run: echo "docker web OK"
