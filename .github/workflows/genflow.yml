name: CI

on:
  push:
    branches: [main, main-platform, v2-island-architecture]
  pull_request:
    branches: [main, main-platform]

permissions: write-all

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust 1.88
        run: |
          rustup toolchain install 1.88 --component clippy,rustfmt --no-self-update
          rustup default 1.88
          cargo --version
      - run: cargo fmt --all -- --check
      # Remove --locked temporarily to allow new data-cleaning crate deps
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --lib --exclude genflow-gateway
      - run: cargo check -p genflow-gateway

  docker-api:
    name: Docker API
    needs: [rust]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - uses: actions/checkout@v4
      - run: echo "docker api OK ${{ github.actor }}"

  docker-web:
    name: Docker Web
    needs: [rust]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - uses: actions/checkout@v4
      - run: echo "docker web OK"
