# =============================================================================
# GenFlow v2 — Production Nginx Configuration
#
# Routes: /api/* → Rust API (port 3000)
#         /*      → Remix Web (port 3000)
#
# Performance: gzip, static caching, connection pooling, HSTS
# =============================================================================

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    # ============================================================
    # Basic settings
    # ============================================================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;
    client_max_body_size 10m;

    # ============================================================
    # MIME types
    # ============================================================
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ============================================================
    # Logging
    # ============================================================
    log_format json escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"remote_user":"$remote_user",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"referer":"$http_referer",'
        '"user_agent":"$http_user_agent",'
        '"request_id":"$http_x_request_id"'
    '}';

    access_log /var/log/nginx/access.log json buffer=32k flush=5s;
    error_log /var/log/nginx/error.log warn;

    # ============================================================
    # Compression
    # ============================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2
        application/wasm;

    # ============================================================
    # Security headers
    # ============================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ============================================================
    # Upstream backends
    # ============================================================
    upstream api_backend {
        server api:3000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    upstream web_backend {
        server web:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # ============================================================
    # HTTP → HTTPS redirect
    # ============================================================
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # In production, redirect to HTTPS
        # return 301 https://$host$request_uri;

        # For initial deployment, serve directly on HTTP
        location / {
            proxy_pass http://web_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 90s;
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 32k;
        }

        location /api/ {
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;

            # CORS for API
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Request-Id" always;

            if ($request_method = OPTIONS) {
                return 204;
            }
        }

        # Healthcheck endpoint
        location /health {
            proxy_pass http://api_backend/health;
            proxy_http_version 1.1;
            access_log off;
        }
    }

    # ============================================================
    # HTTPS server (enable when SSL certs are available)
    # ============================================================
    # server {
    #     listen 443 ssl http2;
    #     listen [::]:443 ssl http2;
    #     server_name genflow.example.com;
    #
    #     ssl_certificate /etc/nginx/ssl/cert.pem;
    #     ssl_certificate_key /etc/nginx/ssl/key.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;
    #     ssl_session_cache shared:SSL:10m;
    #     ssl_session_timeout 10m;
    #
    #     add_header Strict-Transport-Security "max-age=63072000" always;
    #
    #     # Same location blocks as HTTP server
    #     location / {
    #         proxy_pass http://web_backend;
    #         # ... same proxy settings as above ...
    #     }
    #
    #     location /api/ {
    #         rewrite ^/api/(.*) /$1 break;
    #         proxy_pass http://api_backend;
    #         # ... same proxy settings as above ...
    #     }
    # }
}
